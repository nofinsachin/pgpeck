# Light theme following postgresql.org's light mode (its stylesheet,
# dyncss/base.css): white background, #333 text, #e7eae8 for banding, #336791
# (the official PostgreSQL blue) for focus, labels and the column header, and
# #008bb9 for keywords. One background everywhere.
# Colors are names or #rrggbb.
# Focus, errors and NULL are never conveyed by color alone (R20.9).
focus = "#336791"
error = "#b52525"          # the site's red
null = "#848484"
dimmed = "#666666"
keyword = "#008bb9"
number = "#333333"
string = "#585858"
status_prod = "#b52525"
status_fg = "#333333"
status_bg = "#ffffff"
header_fg = "#336791"
header_bg = "#ffffff"
row_alt_bg = "#e7eae8"
ok = "#333333"
warn = "#c4620a"
label = "#336791"
value = "#333333"
line_number = "#848484"
background = "#ffffff"
border = "#688297"         # the site's grayish blue
