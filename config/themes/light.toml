# Light theme in the PostgreSQL palette: blues (#0064a5, #336791, #008bb9) and
# greys (#585858, #666666, #848484) on white, with black text.
# Error, warning and production keep red and orange so they stand out. Row
# banding and the cursor line are faint tints of the palette blue.
# Colors are names or #rrggbb.
focus = "#0064a5"
error = "#b3261e"
null = "#848484"
dimmed = "#666666"
keyword = "#0064a5"
number = "#336791"
string = "#585858"
status_prod = "#b3261e"
status_fg = "#ffffff"
status_bg = "#585858"
header_fg = "#0064a5"
header_bg = "#000000"
row_alt_bg = "#eef3f7"
ok = "#336791"
warn = "#c4620a"
label = "#336791"
value = "#000000"
line_number = "#848484"
cursor_line_bg = "#dbe7f1"
background = "#ffffff"
border = "#336791"
