# Dark theme following postgresql.org's dark mode (its stylesheet, dyncss/base.css):
# #212121 background, #f3f5f9 text, #2e2e2e and #4a4a4a for raised areas,
# #008bb9 for blue text and #699eca (the site's dark-mode link blue) for focus
# and the column header. One background everywhere.
# Colors are names or #rrggbb.
# Focus, errors and NULL are never conveyed by color alone (R20.9).
focus = "#699eca"
error = "#ff8882"          # the site's "no" red
null = "#8a8a8a"
dimmed = "#b0b0b0"
keyword = "#008bb9"
number = "#f3f5f9"
string = "#d4d4d4"
status_prod = "#c8321f"
status_fg = "#f3f5f9"
status_bg = "#212121"
header_fg = "#699eca"
header_bg = "#212121"
row_alt_bg = "#2e2e2e"
ok = "#f3f5f9"
warn = "#ffc27a"
label = "#008bb9"
value = "#f3f5f9"
line_number = "#848484"
background = "#212121"
border = "#6b6b6b"
