# Dark theme in the PostgreSQL palette: one dark grey background everywhere,
# white text, and a single light blue (derived from #008bb9, which is too dark
# to read on grey) for every blue element: keywords, focus, labels and the
# column header. Error, warning and production keep red and orange tints.
# Colors are names or #rrggbb.
# Focus, errors and NULL are never conveyed by color alone (R20.9).
focus = "#9bdcf5"
error = "#ffb3a7"
null = "#c4c4c4"
dimmed = "#d0d0d0"
keyword = "#9bdcf5"
number = "#ffffff"
string = "#d0d0d0"
status_prod = "#c8321f"
status_fg = "#ffffff"
status_bg = "#4a4a4a"
header_fg = "#9bdcf5"
header_bg = "#4a4a4a"
row_alt_bg = "#404040"
ok = "#ffffff"
warn = "#ffc27a"
label = "#9bdcf5"
value = "#ffffff"
line_number = "#c4c4c4"
cursor_line_bg = "#555555"
background = "#4a4a4a"
border = "#000000"
