# Oxpecker default configuration. Every option is shown with its default value.
# Copy this file to $XDG_CONFIG_HOME/oxpecker/config.toml (usually
# ~/.config/oxpecker/config.toml) and change what you need.
# Check your changes with: oxpecker --check-config

[editor]
# When true, Tab inserts an indent while the editor has focus.
# When false, Tab and Shift+Tab move focus between panes everywhere.
# Alt+1/2/3 and F6 always move focus out of the editor.
tab_indent = true

[ui]
# Theme name. Built in: "dark", "light". A file named <theme>.toml in the
# `themes` directory next to this file takes precedence over a built-in theme.
theme = "dark"
# Show the line of available keys under the panes.
show_hint_bar = true
# Show the context strip at startup. F3 toggles it.
show_context_strip = true
