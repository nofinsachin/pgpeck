# pgpeck default configuration. Every option is shown with its default value.
# Copy this file to $XDG_CONFIG_HOME/pgpeck/config.toml (usually
# ~/.config/pgpeck/config.toml) and change what you need.
# Check your changes with: pgpeck --check-config

[editor]
# When true, Tab inserts an indent while the editor has focus.
# When false, Tab and Shift+Tab move focus between panes everywhere.
# Alt+1/2/3 and F6 always move focus out of the editor.
tab_indent = true
# Spaces per indent step. Tab inserts spaces up to the next multiple of this
# width, and pasted tab characters become this many spaces. Range 1 to 16.
indent_width = 4
# Insert the closing ( [ ' or " when you type the opening one.
auto_pair = true
# A new line starts with the indentation of the line above.
auto_indent = true
# Show suggestions while typing. Ctrl+Space (or Alt+/) opens them on demand.
completion = true
# Characters to type before suggestions appear on their own. Range 1 to 10.
completion_min_chars = 2

[ui]
# Theme name. Built in: "dark", "light". A file named <theme>.toml in the
# `themes` directory next to this file takes precedence over a built-in theme.
theme = "dark"
# Show the line of available keys under the panes.
show_hint_bar = true
# Show the context strip at startup. F3 toggles it.
show_context_strip = true

[connections]
# pgpeck never stores a password: it asks each time you connect. If you keep
# passwords elsewhere you can let pgpeck read them, in this order.
#   pgpass    ~/.pgpass, or the file named by $PGPASSFILE (must be mode 0600)
#   env       $PGPASSWORD, or the variable named by a profile's password_env
#   prompt    ask in the interface
# Example: password_sources = ["pgpass", "prompt"]
password_sources = ["prompt"]

[session]
# Seconds between refreshes of the numbers in the Session pane (connections,
# size, cache hits). They are read on your own connection, and only while it
# is idle and no transaction is open. 0 turns the automatic refresh off. The
# refresh key still works.
refresh_seconds = 10

[results]
# Rows kept in memory per result. A single SELECT, WITH, VALUES or TABLE query
# is paged: this many rows are shown at a time, and scrolling past the edge
# loads the next window from the server. Anything else keeps only this many
# rows, counts the rest, and the results line says so. Range 1 to 1000000.
row_limit = 10000
# Page a single read-only query through a server-side cursor. The server keeps
# the whole result in temporary storage until the next run in the same buffer.
# Set to false to keep only the first `row_limit` rows instead.
paged = true

[history]
# Keep a list of the statements you run, with the connection, time taken and
# row count, in $XDG_STATE_HOME/pgpeck/history.tsv (private to you). Rows are
# never stored. Statements that mention a password are left out.
enabled = true
# Entries kept. The oldest are dropped. Range 1 to 100000.
max_entries = 1000
