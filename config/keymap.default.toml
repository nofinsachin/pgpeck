# Oxpecker default keymap.
#
# Format: [scope] then "key" = "action.name". Your own keymap.toml is laid over
# this file. A key you bind replaces the default for that key. Bind a key to
# "none" to remove a default binding. Two actions on the same key in one scope
# is a conflict, and the later one is refused.
#
# Scopes: global, editor, context, results, completion, picker, form, prompt,
# dialog. The context scope is the commands pane that has focus at startup.
# The editor and global scopes cannot bind printable characters, because the
# editor must always accept typing. Use Ctrl, Alt or function keys there.
#
# Key syntax: modifiers joined with "+", then a key: ctrl+q, alt+1, shift+tab,
# f6, enter, esc, space, up, pageup, or a single character.
#
# Many terminals cannot send Ctrl+digit keys, so each focus action also has an
# Alt+digit binding.
#
# Actions: app.quit, focus.context, focus.editor, focus.results, focus.next,
# focus.prev, focus.commands, view.toggle_context, view.toggle_results, help.toggle,
# buffer.new, buffer.close, buffer.next, buffer.prev, buffer.reopen,
# completion.trigger, completion.accept, completion.dismiss, completion.next,
# completion.prev, help.scroll_up, help.scroll_down, help.page_up, help.page_down, and the
# editor.* actions used below. Text is typed into the editor by any printable
# key that has no binding (Ctrl+C is unbound: copy is Alt+C or Ctrl+Insert).

[global]
"ctrl+q" = "app.quit"
"ctrl+1" = "focus.context"
"alt+1" = "focus.context"
"ctrl+2" = "focus.editor"
"alt+2" = "focus.editor"
"ctrl+3" = "focus.results"
"alt+3" = "focus.results"
"f6" = "focus.next"
"shift+f6" = "focus.prev"
"tab" = "focus.next"
"shift+tab" = "focus.prev"
"f3" = "view.toggle_context"
"f4" = "view.toggle_results"
"f1" = "help.toggle"
"ctrl+n" = "buffer.new"
"ctrl+w" = "buffer.close"
"alt+right" = "buffer.next"
"ctrl+pagedown" = "buffer.next"
"alt+left" = "buffer.prev"
"ctrl+pageup" = "buffer.prev"
"alt+t" = "buffer.reopen"
"ctrl+o" = "connection.open"
"alt+o" = "connection.reconnect"
"ctrl+r" = "query.run_statement"
# Cancels the running query. Does nothing when no query is running.
"ctrl+c" = "query.cancel"

[editor]
"left" = "editor.move_left"
"right" = "editor.move_right"
"up" = "editor.move_up"
"down" = "editor.move_down"
"home" = "editor.move_line_start"
"end" = "editor.move_line_end"
"ctrl+left" = "editor.move_word_left"
"ctrl+right" = "editor.move_word_right"
"pageup" = "editor.move_page_up"
"pagedown" = "editor.move_page_down"
"ctrl+home" = "editor.move_buffer_start"
"ctrl+end" = "editor.move_buffer_end"
"shift+left" = "editor.select_left"
"shift+right" = "editor.select_right"
"shift+up" = "editor.select_up"
"shift+down" = "editor.select_down"
"shift+home" = "editor.select_line_start"
"shift+end" = "editor.select_line_end"
"ctrl+shift+left" = "editor.select_word_left"
"ctrl+shift+right" = "editor.select_word_right"
"shift+pageup" = "editor.select_page_up"
"shift+pagedown" = "editor.select_page_down"
"ctrl+shift+home" = "editor.select_buffer_start"
"ctrl+shift+end" = "editor.select_buffer_end"
"ctrl+a" = "editor.select_all"
"backspace" = "editor.backspace"
"delete" = "editor.delete"
"enter" = "editor.newline"
# Tab only edits while `editor.tab_indent` is true. Otherwise it moves focus.
"tab" = "editor.indent"
"shift+tab" = "editor.outdent"
"ctrl+z" = "editor.undo"
"ctrl+y" = "editor.redo"
"ctrl+x" = "editor.cut"
"shift+delete" = "editor.cut"
"alt+c" = "editor.copy"
"ctrl+insert" = "editor.copy"
"ctrl+v" = "editor.paste"
"shift+insert" = "editor.paste"
# Esc leaves the editor for the commands pane, where single keys work.
"esc" = "focus.commands"
"ctrl+space" = "completion.trigger"
"alt+/" = "completion.trigger"

[completion]
# Active only while the suggestion popup is open. Other keys keep typing.
"enter" = "completion.accept"
"tab" = "completion.accept"
"esc" = "completion.dismiss"
"down" = "completion.next"
"up" = "completion.prev"

[context]
# This is the commands pane. It has focus when oxpecker starts, so a single
# key is enough. Typing SQL happens in the editor, which never gives up letters.
"c" = "connection.open"
"r" = "query.run_statement"
"e" = "focus.editor"
"enter" = "focus.editor"
"n" = "buffer.new"
"q" = "app.quit"
"?" = "help.toggle"

[results]
"c" = "connection.open"
"r" = "query.run_statement"
"e" = "focus.editor"
"q" = "app.quit"
"?" = "help.toggle"
"up" = "results.scroll_up"
"down" = "results.scroll_down"
"pageup" = "results.page_up"
"pagedown" = "results.page_down"
"home" = "results.first_row"
"end" = "results.last_row"
"left" = "results.scroll_left"
"right" = "results.scroll_right"
"[" = "results.prev_tab"
"]" = "results.next_tab"

[picker]
"up" = "dialog.prev"
"down" = "dialog.next"
"enter" = "dialog.submit"
"esc" = "dialog.cancel"
"backspace" = "dialog.backspace"
"ctrl+u" = "dialog.clear"
"ctrl+s" = "picker.save_profile"

[form]
"down" = "dialog.next"
"tab" = "dialog.next"
"up" = "dialog.prev"
"shift+tab" = "dialog.prev"
"enter" = "dialog.submit"
"esc" = "dialog.cancel"
"backspace" = "dialog.backspace"
"ctrl+u" = "dialog.clear"

[prompt]
"enter" = "dialog.submit"
"esc" = "dialog.cancel"
"backspace" = "dialog.backspace"
"ctrl+u" = "dialog.clear"

[dialog]
"up" = "help.scroll_up"
"down" = "help.scroll_down"
"pageup" = "help.page_up"
"pagedown" = "help.page_down"
"esc" = "help.toggle"
"f1" = "help.toggle"
"?" = "help.toggle"
