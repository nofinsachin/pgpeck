name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Throwaway credentials for the disposable service container below.
      PGPECK_TEST_DATABASE_URL: postgres://oxtest:s3cr3t-Pw-7731@127.0.0.1:5432/pgpeck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oxtest
          POSTGRES_PASSWORD: s3cr3t-Pw-7731
          POSTGRES_DB: pgpeck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oxtest -d pgpeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
