name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Integration tests that need PostgreSQL. Test files are named with a `pg_` prefix.
  # Added once the first `pg_` test exists:
  #   services:
  #     postgres:
  #       image: postgres:16
  #       env: { POSTGRES_PASSWORD: postgres }
  #       ports: ["5432:5432"]
