[package]
name = "oxpecker"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.29.0"
futures-util = "0.3.34"
ratatui = "0.30.2"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
tokio-postgres = "0.7.18"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.3"
